name: Compatibility

on:
  push:
  pull_request:

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite:
    name: Node ${{ matrix.node }} / Vite ${{ matrix.vite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22, 24, 26]
        vite: [8.0.0, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm 10.8.2, bundled with Node 20.19.0, crashes with "Cannot read properties of null (reading 'edgesOut')"
      # while installing Vite 8.2 or newer (npm/cli#9787). The minimum Vite keeps the bundled npm.
      - run: npm install --global npm@11
        if: matrix.node == '20.19.0' && matrix.vite == '8'
      - run: npm ci
      - run: npm run build
      - run: npm run compat:vite
        env:
          VITE_VERSION: ${{ matrix.vite }}

  shopify:
    name: Node 24 / Shopify CLI ${{ matrix.shopify }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shopify: [3.94.3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compat:shopify
        env:
          SHOPIFY_CLI_VERSION: ${{ matrix.shopify }}

  frameworks:
    name: Node 24 / ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [vue, react]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run compat:${{ matrix.framework }}

  packaging:
    name: Node 24 / npm ${{ matrix.npm }} / package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        npm: [10.8.2, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm install --global npm@${{ matrix.npm }}
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check

  consumers:
    name: Node 24 / ${{ matrix.manager }} consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: oven-sh/setup-bun@v2
        if: matrix.manager == 'bun'
      - run: npm install --global pnpm@latest
        if: matrix.manager == 'pnpm'
      - run: npm install --global yarn@latest
        if: matrix.manager == 'yarn'
      - run: npm ci
      - run: npm run build
      - run: npm run compat:consumer -- ${{ matrix.manager }}

  editor:
    name: ${{ matrix.os }} / ${{ matrix.manager }} / dev --editor
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, manager: npm }
          - { os: ubuntu-latest, manager: pnpm }
          - { os: ubuntu-latest, manager: yarn }
          - { os: ubuntu-latest, manager: bun }
          - { os: macos-latest, manager: npm }
          - { os: windows-latest, manager: npm }
          - { os: windows-latest, manager: pnpm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: oven-sh/setup-bun@v2
        if: matrix.manager == 'bun'
      - run: npm install --global pnpm@latest
        if: matrix.manager == 'pnpm'
      - run: npm install --global yarn@latest
        if: matrix.manager == 'yarn'
      - run: npm ci
      - run: npm run build
      - run: npm run compat:editor -- ${{ matrix.manager }}
