name: Compatibility

on:
  push:
  pull_request:

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite:
    name: Node ${{ matrix.node }} / Vite ${{ matrix.vite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22, 24, 26]
        vite: [8.0.0, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run compat:vite
        env:
          VITE_VERSION: ${{ matrix.vite }}

  shopify:
    name: Node 24 / Shopify CLI ${{ matrix.shopify }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shopify: [3.94.3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compat:shopify
        env:
          SHOPIFY_CLI_VERSION: ${{ matrix.shopify }}
